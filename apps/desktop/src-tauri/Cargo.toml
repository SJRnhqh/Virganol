[package]
name = "Virganol"
version = "0.0.1"
description = "Virganol Desktop App"
authors = ["you"]
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- 新增依赖 ---
# ssh2: 商业友好的 SSH 协议实现
# 使用 vendored-openssl 特性可以减少你在不同机器上编译时对系统库的依赖
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
# tokio: 异步支持，防止连接服务器时卡死前端界面
tokio = { version = "1", features = ["full"] }
tauri-plugin-os = "2.3.2"
portable-pty = "0.8"
directories = "5.0"
tauri-plugin-shell = "2"
