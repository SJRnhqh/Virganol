syntax = "proto3";

package virganol.v1;

option go_package = "virganol/v1;virganolv1";

service BaseService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string reply = 1;
  int64 timestamp = 2;
}

message ShutdownRequest {
  int64 timeout_ms = 1;
}

message ShutdownResponse {
  bool acknowledged = 1;
}