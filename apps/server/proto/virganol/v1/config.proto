syntax = "proto3";

package virganol.v1;

option go_package = "virganol/v1;virganolv1";

service ConfigService {
  // 保存配置（scoped write）
  rpc SetLLMConfig(SetLLMConfigRequest) returns (SetLLMConfigResponse);
  // 获取配置（scoped read）
  rpc GetLLMConfig(GetLLMConfigRequest) returns (GetLLMConfigResponse);
}

message LLMConfig {
  string provider = 1;
  string api_key = 2;
  string model = 3;
}

message SetLLMConfigRequest {
  LLMConfig config = 1;
}

message SetLLMConfigResponse {
  bool success = 1;
  string message = 2;
}

message GetLLMConfigRequest {}

message GetLLMConfigResponse {
  LLMConfig config = 1;
  bool exists = 2;
}