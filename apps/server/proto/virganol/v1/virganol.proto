// apps/server/proto/virganol/v1/virganol.proto
syntax = "proto3";

package virganol.v1;

service BaseService {
  // 【核心修复2】解决命名警告
  // RPC方法名是 Ping，返回值必须是 PingResponse (不能叫 PongResponse)
  rpc Ping(PingRequest) returns (PingResponse);
  // 优雅关闭请求 - 由 Rust 端调用，通知 Go 端开始关闭流程
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

message PingRequest {
  string message = 1;
}

// 把 PongResponse 改名为 PingResponse 以满足规范
message PingResponse {
  string reply = 1;
  int64 timestamp = 2;
}

// 关闭请求
message ShutdownRequest {
  // 可选：优雅关闭的超时时间（毫秒）
  int64 timeout_ms = 1;
}

// 关闭响应
message ShutdownResponse {
  // 确认已收到关闭请求
  bool acknowledged = 1;
}

// LLMConfig 表示LLM供应商的配置信息
message LLMConfig {
  // 供应商名称 (e.g., "openai", "claude", "gemini")
  string provider = 1;

  // API密钥
  string api_key = 2;

  // 模型名称 (e.g., "gpt-4", "claude-3-opus")
  string model = 3;
}

// SetLLMConfigRequest 用于设置LLM配置
message SetLLMConfigRequest {
  LLMConfig config = 1;
}

// SetLLMConfigResponse 是SetLLMConfig的响应
message SetLLMConfigResponse {
  // 是否设置成功
  bool success = 1;

  // 错误或成功信息
  string message = 2;
}

// GetLLMConfigRequest用于请求获取LLM配置
message GetLLMConfigRequest {}

// GetLLMConfigResponse 是GetLLMConfig的响应
message GetLLMConfigResponse {
  // 当前保存的LLM配置
  LLMConfig config = 1;

  // 是否存在配置
  bool exists = 2;
}

// ConfigService 提供LLM配置相关的RPC方法
service ConfigService {
  // SetLLMConfig 设置LLM供应商配置
  rpc SetLLMConfig(SetLLMConfigRequest) returns (SetLLMConfigResponse);

  // GetLLMConfig 获取当前的LLM配置
  rpc GetLLMConfig(GetLLMConfigRequest) returns (GetLLMConfigResponse);
}
