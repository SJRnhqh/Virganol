name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev
      - "feat/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, Test, Check
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint UI
        run: bash .github/ci/ui-lint.sh

      - name: Test Go server
        env:
          GOCACHE: ${{ runner.temp }}/go-cache
        run: bash .github/ci/go-test.sh

      - name: Check Rust desktop
        run: bash .github/ci/rust-check.sh
