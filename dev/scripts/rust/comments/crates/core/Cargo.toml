[package]
name = "virganol-rust-comment-checker-core"
version = "0.0.1"
description = "Core syntax analysis library for Virganol Rust comment checks."
edition = "2021"
publish = false

[dependencies]
proc-macro2 = { version = "1.0", features = ["span-locations"] }
syn = { version = "2.0", features = ["full"] }
